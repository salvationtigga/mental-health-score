
name: Mental Health Score - CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. Checkout latest code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Deploy code to EC2
      - name: Upload Code
        shell: bash
        run: |
          set -euo pipefail

          rsync -av \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pem' \
            --exclude='*.ppk' \
            ./ /home/ubuntu/app/

      # 3. Install dependencies
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd /home/ubuntu/app

          python3 -m venv venv

          source venv/bin/activate

          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then
            echo "requirements.txt not found!"
            exit 1
          fi

          pip install -r requirements.txt

          echo "Dependencies installed successfully"

      # 4. Restart FastAPI
      - name: Restart Application
        shell: bash
        run: |
          set -euo pipefail

          sudo systemctl restart mental-health-score

          sudo systemctl is-active --quiet mental-health-score

          echo "Application restarted successfully!"

      # 5. Health Check
      - name: API Health Check
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8000/docs > /dev/null; then
              echo "API is working successfully!"
              exit 0
            fi

            sleep 3
          done

          echo "API health check failed!"
          sudo journalctl -u mental-health-score -n 30 --no-pager
          exit 1
