name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to app directory
        run: |
          mkdir -p /home/ubuntu/app
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ /home/ubuntu/app/

